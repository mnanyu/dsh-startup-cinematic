name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and test
        run: |
          npm run build
          npm test
      - name: Pack plugin
        run: npm pack
      - name: Build Windows bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp dsh-startup-cinematic-*.tgz release/
          cp install.cmd README.md release/
          cd release
          zip -r "../dsh-startup-cinematic-${VERSION}-windows.zip" .
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-startup-cinematic-*.tgz
            dsh-startup-cinematic-*-windows.zip
          generate_release_notes: true
