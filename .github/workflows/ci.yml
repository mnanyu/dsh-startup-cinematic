name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build generated boot document
        run: npm run build
      - name: Smoke test
        run: npm test
      - name: Ensure lib/boot.html is committed and current
        run: git diff --exit-code -- lib/boot.html
